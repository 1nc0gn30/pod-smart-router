[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-smart-router"
version = "1.0.0"
description = "Autonomous Multi-Channel POD Smart Order Router & Domestic Cost Optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Neal Frazier", email = "neal@nealfrazier.tech" }
]
keywords = ["pod", "print-on-demand", "router", "printify", "gelato", "etsy", "shopify", "mcp"]

[project.scripts]
pod-smart-router = "pod_smart_router.cli:main"
